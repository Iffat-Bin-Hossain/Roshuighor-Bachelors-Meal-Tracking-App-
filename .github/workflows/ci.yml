name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Node & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Build & Type Check Backend
        working-directory: Backend
        run: npm run build

  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: Frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: Frontend
        run: npm run build

  mobile-ci:
    name: Mobile App CI (React Native / Expo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MobileApp/package-lock.json

      - name: Install Mobile dependencies
        working-directory: MobileApp
        run: npm ci

      - name: Verify package integrity
        working-directory: MobileApp
        run: npm audit --audit-level=critical || true

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose File Syntax
        run: docker compose -f Database/docker-compose.yml config
