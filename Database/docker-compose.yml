# Explicit project name: without it Compose derives the name from the folder ("database"),
# which collides with any other project whose compose file also lives in a "database" folder.
name: rosuighor

services:
  postgres:
    image: postgres:16-alpine
    container_name: rosuighor_postgres
    restart: always
    environment:
      POSTGRES_DB: "রসুইঘর"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "Iffat25082002"
    ports:
      - "5435:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - rosuighor_pgdata:/var/lib/postgresql/data

volumes:
  rosuighor_pgdata:
    driver: local
